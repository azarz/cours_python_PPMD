site_name: Internet & données géographiques
nav:
    - Accueil: index.md
    - Déroulé des cours: déroulé.md
    - TP d'introduction: tp/intro.md
    - Fil rouge:
        - Présentation et sujets: fil_rouge/README.md
        - Implémentation: fil_rouge/implementation.md
        - Documentation et tests: fil_rouge/documentation_et_tests.md
    - Supports de cours:
        - Présentation de l'orienté objet en Python: supports_cours/Cours_Slides_Intro_POO_Intro_POO.pdf
        - Analyse informatique - présentation: supports_cours/Analyse_informatique_presentation.md
        - Analyse informatique - exercices: supports_cours/Analyse_informatique_exercices.pdf

markdown_extensions:
    - attr_list
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - fenced_code
    - toc:
        baselevel: 2
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences:
        custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
    - admonition
    - pymdownx.details

theme:
  name: material
  language: fr
  palette:
    primary: indigo
    accent: deep orange
  logo: logo.svg
  favicon: logo.svg
  features:
    - content.code.copy
plugins:
  - search
